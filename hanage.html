
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ハナゲー - 鼻毛を抜け！</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    color: #eee;
    font-family: "Hiragino Sans", "Meiryo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    margin: 10px 0 4px;
    font-size: clamp(22px, 6vw, 28px);
    text-shadow: 0 0 8px #ff6b6b;
  }
  #info {
    font-size: clamp(14px, 4vw, 16px);
    margin-bottom: 6px;
  }
  #game-container {
    width: 100%;
    max-width: 480px;
    padding: 0 8px;
    display: flex;
    justify-content: center;
  }
  canvas {
    width: 100%;
    max-width: 480px;
    height: auto;
    aspect-ratio: 480 / 520;
    background: #16213e;
    border: 4px solid #e94560;
    border-radius: 12px;
    cursor: crosshair;
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
    display: block;
  }
  #message {
    margin-top: 10px;
    font-size: clamp(16px, 4.5vw, 20px);
    height: 28px;
    color: #ffcc00;
    text-align: center;
    padding: 0 10px;
  }
  #sound-toggle {
    margin-top: 8px;
    padding: 6px 14px;
    font-size: 14px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>ハナゲー</h1>
  <div id="info">スコア: <span id="score">0</span>　｜　生えてる鼻毛: <span id="count">0</span></div>
  <div id="game-container">
    <canvas id="c" width="480" height="520"></canvas>
  </div>
  <div id="message">鼻毛が見えたらタップ/クリックで抜け！</div>
  <button id="sound-toggle">🔊 音ON</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const countEl = document.getElementById('count');
const messageEl = document.getElementById('message');
const soundToggle = document.getElementById('sound-toggle');

let score = 0;
let hairs = [];
let soundEnabled = true;
let audioCtx = null;

// 顔・鼻の位置（論理座標系）
const face = { x: 240, y: 260, radius: 140 };
const nose = { x: 240, y: 270, width: 38, height: 55 };

// ===== 音関連 =====
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playPluckSound() {
  if (!soundEnabled || !audioCtx) return;

  const now = audioCtx.currentTime;

  // 短いノイズ風の「プチッ」音
  const bufferSize = audioCtx.sampleRate * 0.08;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.5);
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800 + Math.random() * 600;
  filter.Q.value = 1.5;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.35, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start(now);
  noise.stop(now + 0.08);
}

function playMissSound() {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.12);
}

// 音ON/OFF
soundToggle.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundToggle.textContent = soundEnabled ? '🔊 音ON' : '🔇 音OFF';
  if (soundEnabled) initAudio();
});

// ===== 鼻毛クラス =====
class Hair {
  constructor() {
    this.baseX = nose.x + (Math.random() - 0.5) * 28;
    this.baseY = nose.y + 18 + Math.random() * 12;
    this.length = 8 + Math.random() * 10;
    this.angle = (Math.random() - 0.5) * 0.9;
    this.thickness = 1.8 + Math.random() * 1.2;
    this.color = `hsl(${20 + Math.random()*20}, 40%, ${25 + Math.random()*15}%)`;
    this.growing = true;
    this.maxLength = 25 + Math.random() * 35;
    this.growthSpeed = 0.15 + Math.random() * 0.25;
    this.alive = true;
  }

  update() {
    if (this.growing && this.length < this.maxLength) {
      this.length += this.growthSpeed;
    }
  }

  draw() {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.baseX, this.baseY);
    ctx.rotate(this.angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(2, -this.length * 0.5, -1, -this.length);
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.thickness;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  isHit(mx, my) {
    const tipX = this.baseX + Math.sin(this.angle) * this.length;
    const tipY = this.baseY - Math.cos(this.angle) * this.length;
    return Math.hypot(mx - tipX, my - tipY) < 16;
  }
}

function spawnHair() {
  if (hairs.filter(h => h.alive).length < 18) {
    hairs.push(new Hair());
  }
}

function drawFace() {
  // 顔
  ctx.beginPath();
  ctx.arc(face.x, face.y, face.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#f5d0a9';
  ctx.fill();
  ctx.strokeStyle = '#d4a373';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 目
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(face.x - 55, face.y - 40, 12, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(face.x + 55, face.y - 40, 12, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // ハイライト
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(face.x - 52, face.y - 48, 4, 0, Math.PI * 2);
  ctx.arc(face.x + 58, face.y - 48, 4, 0, Math.PI * 2);
  ctx.fill();

  // 鼻
  ctx.beginPath();
  ctx.moveTo(nose.x - nose.width/2, nose.y - 10);
  ctx.quadraticCurveTo(nose.x, nose.y + nose.height, nose.x + nose.width/2, nose.y - 10);
  ctx.strokeStyle = '#c9a373';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 鼻の穴
  ctx.fillStyle = '#8b5e3c';
  ctx.beginPath();
  ctx.ellipse(nose.x - 9, nose.y + 22, 6, 4, -0.3, 0, Math.PI * 2);
  ctx.ellipse(nose.x + 9, nose.y + 22, 6, 4, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // 口
  ctx.beginPath();
  ctx.arc(face.x, face.y + 70, 35, 0.15, Math.PI - 0.15);
  ctx.strokeStyle = '#a0525a';
  ctx.lineWidth = 3;
  ctx.stroke();
}

// 座標変換（キャンバスの実際の表示サイズに対応）
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  let clientX, clientY;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function handleInput(e) {
  e.preventDefault();
  initAudio(); // ユーザー操作でAudioContextを開始

  const pos = getCanvasPos(e);
  let plucked = false;

  for (let i = hairs.length - 1; i >= 0; i--) {
    const h = hairs[i];
    if (h.alive && h.isHit(pos.x, pos.y)) {
      h.alive = false;
      score += Math.floor(h.length / 3) + 1;
      plucked = true;
      playPluckSound();
      messageEl.textContent = ['ぬけた！', 'いい感じ！', 'スッキリ！', 'よし！', 'まだあるぞ！'][Math.floor(Math.random()*5)];
      break;
    }
  }

  if (!plucked) {
    playMissSound();
    messageEl.textContent = 'そこじゃない…！';
  }
  scoreEl.textContent = score;
}

// イベント登録（クリック＋タッチ）
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', handleInput, { passive: false });
canvas.addEventListener('touchend', e => e.preventDefault(), { passive: false });

// メインループ
let spawnTimer = 0;
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawFace();

  let aliveCount = 0;
  for (const h of hairs) {
    if (h.alive) {
      h.update();
      h.draw();
      aliveCount++;
    }
  }
  countEl.textContent = aliveCount;

  spawnTimer++;
  if (spawnTimer > 45) {
    spawnHair();
    spawnTimer = 0;
  }

  if (aliveCount >= 16) {
    messageEl.textContent = '鼻毛だらけだ…！もっと抜け！';
  }

  requestAnimationFrame(loop);
}

// 初期化
for (let i = 0; i < 5; i++) spawnHair();
loop();
</script>
</body>
</html>
